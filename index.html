<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACROX // Executive Intelligence Engine</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #09090b;
      --border: #27272a;
      --border-accent: #3f3f46;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --accent: #ffffff;
      --accent-badge: #22c55e;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 48rem;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .status-badge {
      font-size: 0.75rem;
      background: var(--panel);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    /* Chat Container */
    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 48rem;
      margin: 0 auto;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .empty-state {
      margin: auto;
      text-align: center;
    }

    .empty-state .title {
      font-size: 1.125rem;
      font-weight: 600;
      color: #a1a1aa;
    }

    .empty-state .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Messages */
    .message {
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      line-height: 1.625;
      border: 1px solid transparent;
      word-break: break-word;
    }

    .message .tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .user-msg {
      background-color: var(--panel);
      border-color: var(--border-accent);
      color: #ffffff;
      align-self: flex-end;
      max-width: 80%;
    }

    .blacrox-msg {
      background-color: #030303;
      border-color: var(--border);
      color: #d4d4d8;
      width: 100%;
      align-self: flex-start;
    }

    .content-body {
      white-space: pre-wrap;
    }

    /* Footer & Input */
    footer {
      width: 100%;
      max-width: 48rem;
      margin: 0 auto;
      padding: 0 1rem 1.5rem 1rem;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      background-color: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem 6rem 0.75rem 1rem;
      font-size: 0.875rem;
      color: #ffffff;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: #71717a;
      box-shadow: 0 0 0 1px #71717a;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    button {
      position: absolute;
      right: 0.5rem;
      background: var(--accent);
      color: #000000;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background-color: #e4e4e7;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1 class="brand">BLACROX</h1>
    <span class="status-badge">STATUS: ONLINE • ULTRA-FAST</span>
  </header>

  <!-- Messages -->
  <main id="chat-container">
    <div class="empty-state" id="empty-state">
      <p class="title">BLACROX ENGINE READY</p>
      <p class="subtitle">Enter a query below to receive instantaneous intelligence.</p>
    </div>
  </main>

  <!-- Input Form -->
  <footer>
    <form id="chat-form">
      <div class="input-box">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Type your command or query..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="run-btn">Run</button>
      </div>
    </form>
  </footer>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const container = document.getElementById('chat-container');
    const emptyState = document.getElementById('empty-state');
    const runBtn = document.getElementById('run-btn');

    // Groq API Key
    const GROQ_API_KEY = "gsk_RBLdB2MB1CNqJyahko7sWGdyb3FYREju8wCDCnNxCHYLmbSF9iH1M";
    const conversationHistory = [
      {
        role: "system",
        content: "You are BLACROX, a high-speed intelligence advisor for executives and builders. Your tone is confident, direct, analytical, and authoritative. When answering any query: Start directly with the core bottom-line takeaway in bold. Provide 3 high-impact strategic bullet points. Conclude with a single 'Action Step'. Strict limit: Under 120 words. No introductory fluff."
      }
    ];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageText = input.value.trim();
      if (!messageText) return;

      if (emptyState) emptyState.style.display = 'none';

      // 1. Render User Message
      appendMessage('USER', messageText, 'user-msg');
      conversationHistory.push({ role: 'user', content: messageText });

      input.value = '';
      runBtn.disabled = true;

      // 2. Render Assistant Message placeholder
      const blacroxContent = appendMessage('BLACROX', '', 'blacrox-msg');

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: conversationHistory,
            stream: true
          })
        });

        if (!response.ok) throw new Error("Groq API Error: " + response.status);

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullResponse = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              try {
                const data = JSON.parse(line.replace("data: ", ""));
                const token = data.choices[0]?.delta?.content || "";
                fullResponse += token;
                blacroxContent.textContent = fullResponse;
                container.scrollTop = container.scrollHeight;
              } catch (err) {
                // Ignore parse errors on chunks
              }
            }
          }
        }

        conversationHistory.push({ role: 'assistant', content: fullResponse });
      } catch (err) {
        blacroxContent.textContent = 'ERROR: Unable to communicate with the BLACROX processing engine. Check API key status.';
      } finally {
        runBtn.disabled = false;
        input.focus();
      }
    });

    function appendMessage(sender, text, className) {
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `message ${className}`;

      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = sender;

      const body = document.createElement('div');
      body.className = 'content-body';
      body.textContent = text;

      msgWrapper.appendChild(tag);
      msgWrapper.appendChild(body);
      container.appendChild(msgWrapper);

      container.scrollTop = container.scrollHeight;
      return body;
    }
  </script>
</body>
</html>
